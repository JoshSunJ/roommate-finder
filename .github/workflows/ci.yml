name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: roommate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d roommate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: roommate

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/roommate_ci
      AUTH_SECRET: ci-only-secret-not-used-in-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roommate/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild schema from committed migrations
        run: npm run db:deploy

      - name: Verify migration status
        run: npm run db:status

      - name: Run unit tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Create production build
        run: npm run build
